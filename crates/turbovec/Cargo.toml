[package]
name = "turbovec"
version = "0.1.0"
edition = "2021"
description = "TurboQuant vector quantization — fast, data-oblivious compression to 2-4 bits per dimension"
license = "MIT"
repository = "https://github.com/RyanCodrai/turbovec"
keywords = ["vector", "quantization", "similarity", "search", "simd"]
categories = ["algorithms", "science"]

[dependencies]
faer = "0.20"
ndarray = "0.17"
ordered-float = "4"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.10"
statrs = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.17", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[lints.clippy]
all = "allow"
pedantic = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
ndarray = { version = "0.17", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"] }
