<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="vecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect x="2" y="2" width="476" height="116" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Magnifying glass icon -->
  <g transform="translate(28, 24)">
    <!-- Glass circle -->
    <circle cx="30" cy="30" r="22" fill="none" stroke="url(#vecGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Handle -->
    <line x1="46" y1="46" x2="64" y2="64" stroke="url(#vecGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Vector dots inside the glass (representing vector space) -->
    <circle cx="22" cy="22" r="3" fill="#6366f1" opacity="0.9"/>
    <circle cx="36" cy="26" r="2.5" fill="#818cf8" opacity="0.7"/>
    <circle cx="28" cy="36" r="2" fill="#a855f7" opacity="0.6"/>
    <circle cx="18" cy="32" r="2.2" fill="#7c3aed" opacity="0.5"/>
    <circle cx="34" cy="18" r="1.8" fill="#c084fc" opacity="0.55"/>
    <circle cx="26" cy="28" r="1.5" fill="#6366f1" opacity="0.4"/>

    <!-- Connecting lines (vector similarity) -->
    <line x1="22" y1="22" x2="36" y2="26" stroke="#818cf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="22" y1="22" x2="28" y2="36" stroke="#818cf8" stroke-width="0.8" opacity="0.25"/>
    <line x1="36" y1="26" x2="28" y2="36" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- "grepvec" text -->
  <text x="118" y="72" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="46" font-weight="700" letter-spacing="-1">
    <tspan fill="#1e293b">grep</tspan><tspan fill="url(#vecGrad)">vec</tspan>
  </text>

  <!-- Tagline -->
  <text x="120" y="96" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">
    semantic search, grep simplicity
  </text>
</svg>
